<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="compleksity">
<title>compleksity</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap');

:root{--bg:#08090b;--panel:#0c0e11;--border:#1b1f24;--hover:#303741;--text:#dfe3e8;--muted:#69717c;--dim:#3d444d;--blue:#7aa7ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.7 "Geist Mono",monospace}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -15%,rgba(100,145,220,.08),transparent 35%)}
a{color:inherit;text-decoration:none}
::selection{background:var(--blue);color:#08090b}
.container{width:min(720px,calc(100% - 36px));margin:auto}

header{padding:78px 0 65px;text-align:center}
.avatar{width:108px;height:108px;margin:0 auto 25px;border-radius:50%;overflow:hidden;border:1px solid rgba(122,167,255,.5);box-shadow:0 0 35px rgba(70,110,180,.08)}
.avatar img{width:100%;height:100%;display:block;object-fit:cover}
.name{margin:0;color:#f1f3f5;font-size:clamp(30px,6vw,40px);font-weight:500;letter-spacing:-2px}
.cursor{display:inline-block;width:8px;height:29px;margin-left:6px;vertical-align:-2px;background:var(--blue);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.subtitle{margin-top:10px;color:var(--muted);font-size:12px}
.navigation{display:flex;justify-content:center;gap:24px;margin-top:25px}
.navigation a{color:var(--muted);transition:.2s}
.navigation a:hover{color:var(--blue)}
.navigation a:before{content:"./";color:var(--dim)}

section{margin-bottom:60px}
.heading{display:flex;align-items:center;gap:10px;margin-bottom:17px;color:#d9dde2;font-size:13px;font-weight:500}
.heading:before{content:"";width:4px;height:15px;background:var(--blue)}
.heading:after{content:"";flex:1;height:1px;background:var(--border)}

.about{padding:23px 25px;border:1px solid var(--border);border-radius:6px;background:rgba(12,14,17,.65)}
.about p{margin:0;color:#858d97}
.about p+p{margin-top:10px}
.about .bright{color:#c9ced5}

.projects{border-top:1px solid var(--border)}
.project{display:grid;grid-template-columns:175px 1fr 20px;align-items:center;gap:15px;padding:14px 4px;border-bottom:1px solid var(--border);transition:.2s}
.project:hover{padding-left:10px;padding-right:10px;background:rgba(122,167,255,.025)}
.project-name{color:var(--blue);font-weight:500}
.project-info{color:var(--muted);font-size:11px}
.arrow{color:var(--dim);text-align:right;transition:.2s}
.project:hover .arrow{color:var(--blue);transform:translateX(3px)}

.stack{color:var(--muted);font-size:12px}
.stack span{color:var(--dim);margin:0 8px}

.contact{display:flex;gap:10px;flex-wrap:wrap}
.contact a{padding:9px 13px;border:1px solid var(--border);border-radius:4px;color:var(--muted);transition:.2s}
.contact a:hover{color:var(--blue);border-color:var(--hover)}

footer{padding:0 0 55px;color:var(--dim);font-size:10px;text-align:center}
footer span{color:var(--blue)}

@media(max-width:600px){
header{padding-top:48px}
.container{width:calc(100% - 28px)}
.project{grid-template-columns:1fr 18px}
.project-info{grid-column:1}
.arrow{grid-column:2;grid-row:1/span 2}
.navigation{gap:15px;flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="container">

<header>
<div class="avatar"><img src="https://cdn.discordapp.com/avatars/1322476737598193705/7ed59f3f6b32f556c90cfefe0a4da3ba.png?size=4096" alt="compleksity"></div>
<h1 class="name">compleksity<span class="cursor"></span></h1>
<div class="subtitle">online.</div>
<nav class="navigation">
<a href="#about">about</a>
<a href="#projects">projects</a>
<a href="#contact">contact</a>
</nav>
</header>

<main>

<section id="about">
<div class="heading">about</div>
<div class="about">
<p><span class="bright">i make things.</span></p>
<p>websites, software, random shit.</p>
<p>sometimes they work.</p>
</div>
</section>

<section id="projects">
<div class="heading">projects</div>
<div class="projects">
<a class="project" href="https://github.com/compleksityy/python-projects" target="_blank" rel="noopener">
<div class="project-name">python-projects</div>
<div class="project-info">30+ python projects</div>
<div class="arrow">→</div>
</a>
</div>
</section>

<section>
<div class="heading">stack</div>
<div class="stack">linux<span>·</span>web<span>·</span>python<span>·</span>javascript</div>
</section>

<section id="contact">
<div class="heading">contact</div>
<div class="contact">
<a href="https://github.com/compleksityy" target="_blank" rel="noopener">github</a>
<a href="https://discord.com/users/1322476737598193705" target="_blank" rel="noopener">discord</a>
<a href="mailto:compleksitycoder@gmail.com">email</a>
</div>
</section>

</main>

<footer>© 2026 <span>compleksity</span></footer>
</div>
</body>
</html>
